name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
      - name: Smoke-test the installed wheel, outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv smoke
          smoke/bin/pip install dist/*.whl
          smoke/bin/python -c "
          from moodcheck.research.corpus import load_depressed_docs, load_neutral_docs, load_not_depressed_docs
          assert len(load_depressed_docs()) == 424
          assert len(load_not_depressed_docs()) == 154
          assert len(load_neutral_docs()) == 300
          from importlib import resources
          assert (resources.files('moodcheck.research') / 'data' / 'README.md').is_file(), 'data card missing from wheel'
          assert (resources.files('moodcheck.research') / 'data' / 'LICENSE-GoEmotions.txt').is_file(), 'GoEmotions license missing from wheel'
          "
          echo "good-bye" | smoke/bin/moodcheck chat
          echo "I want to die" | smoke/bin/moodcheck chat | grep -F "988lifeline.org/chat"
          echo "I had a long day at work." > ok.txt
          smoke/bin/moodcheck research predict ok.txt | grep -F "The model's guess"
          echo "I want to die" > crisis.txt
          smoke/bin/moodcheck research predict crisis.txt | grep -F "988lifeline.org/chat"
