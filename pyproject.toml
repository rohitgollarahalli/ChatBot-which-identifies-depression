# Packaging (hatchling, src layout; the corpora ship inside the wheel) and tool
# configuration. Install with `pip install .`; dev tools: requirements-dev.txt.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moodcheck"
version = "0.2.0.dev0"
description = "ELIZA-style reflective chatbot with a classical-ML mood classifier and a crisis-language safety screen (academic project, not a medical device)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/moodcheck/research/data/LICENSE-GoEmotions.txt"]
requires-python = ">=3.10"
dependencies = [
  "nltk>=3.8",
  "scikit-learn>=1.3",
  "joblib>=1.3",
]
classifiers = [
  # The corpora are unlicensed third-party text (verbatim Reddit posts and a
  # HappyDB slice); see src/moodcheck/research/data/README.md. Keep this off PyPI.
  "Private :: Do Not Upload",
]

[project.scripts]
moodcheck = "moodcheck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/moodcheck"]

# Dev dependencies live in requirements-dev.txt (single source of truth).

[project.urls]
Repository = "https://github.com/rohitgollarahalli/ChatBot-which-identifies-depression"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src/moodcheck"]
ignore_missing_imports = true
