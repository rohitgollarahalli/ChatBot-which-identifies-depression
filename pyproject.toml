[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moodcheck"
version = "0.2.0.dev0"
description = "ELIZA-style reflective chatbot with a classical-ML mood classifier and a crisis-language safety screen (academic project, not a medical device)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "nltk>=3.8",
  "scikit-learn>=1.3",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov",
  "ruff",
  "mypy",
  "pre-commit",
]

[project.urls]
Repository = "https://github.com/rohitgollarahalli/ChatBot-which-identifies-depression"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
